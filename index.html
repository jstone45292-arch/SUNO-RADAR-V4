<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6b00">

<title>SUNO Radar V6.9.3</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial
}
header{
  padding:22px;
  background:#1f1f1f;
  font-size:30px;
  font-weight:bold
}
.toolbar{
  padding:15px;
  background:#151515;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}
button{
  padding:10px 16px;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer
}
button:disabled{
  opacity:.6;
  cursor:not-allowed
}
input,select{
  padding:10px;
  border-radius:8px;
  border:1px solid #444;
  background:#222;
  color:white
}
.btn{background:#333;color:white}
.scan{background:#00b894;color:white}
.manage{background:#3b82f6;color:white}
.youtube{background:#dc2626;color:white}
.youtubeRadar{background:#b91c1c;color:white}
.active{background:#ff6b00!important;color:white}
.danger{background:#dc2626;color:white}
.onbtn{background:#16a34a;color:white}
.offbtn{background:#666;color:white}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  padding:14px 18px;
  background:#151515
}
.statBox{
  background:#242424;
  border-radius:12px;
  padding:14px
}
.statNum{
  font-size:24px;
  font-weight:bold;
  color:#ffb86b
}
.statLabel{
  font-size:13px;
  color:#aaa;
  margin-top:4px
}
.searchBar{
  padding:12px 18px;
  background:#111;
  display:flex;
  gap:10px;
  flex-wrap:wrap
}
#count{
  padding:0 18px 12px;
  color:#aaa
}
#tracks{padding:18px}
.card{
  background:#242424;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px
}
.title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px
}
.badge{
  padding:3px 7px;
  border-radius:6px;
  font-size:12px;
  margin-right:6px
}
.new{background:#ff3333;color:white}
.read{background:#666;color:white}
.archived{background:#555;color:#ddd}
.friend a{
  color:#b9a7ff;
  text-decoration:none
}
.meta{
  color:#aaa;
  margin-top:5px
}
.listen{
  display:inline-block;
  margin-top:12px;
  padding:9px 18px;
  background:#ff6b00;
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold
}

#friendPanel,
#latestPanel,
#youtubePanel,
#youtubeChannelPanel{
  display:none;
  padding:18px;
  background:#181818;
  border-top:1px solid #333
}

.friendForm{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px
}
.friendRow,
.latestRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  background:#242424;
  margin-bottom:8px;
  padding:12px;
  border-radius:10px
}
.friendActions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end
}
.friendName{font-weight:bold}
.small{font-size:13px;color:#aaa}
.off{opacity:.45}
.youtubeFound{
  background:#dc2626!important;
  color:white
}
.youtubeNone{
  background:#666!important;
  color:white
}
.youtubeStatus{
  margin-top:5px;
  font-size:12px;
  color:#aaa
}

/* YouTube 채널관리 */
.youtubeChannelToolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin:12px 0
}
.youtubeChannelRow{
  display:flex;
  align-items:center;
  gap:12px;
  background:#242424;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:8px
}
.youtubeChannelThumb{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#111
}
.youtubeChannelInfo{
  flex:1;
  min-width:0
}
.youtubeChannelTitle{
  font-weight:bold;
  margin-bottom:4px
}
.youtubeChannelSummary{
  color:#aaa;
  margin:8px 0 12px
}

.youtubeChannelFilters{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:8px 0 12px
}
.filterbtn{
  background:#333;
  color:white
}
.filterbtn.activeFilter{
  background:#ff6b00!important;
  color:white
}
.relationMutual{
  background:#7c3aed;
  color:white
}
.relationUnknown{
  background:#555;
  color:white
}
.favoriteOn{
  background:#f59e0b;
  color:#111
}
.favoriteOff{
  background:#444;
  color:#ddd
}
.channelBadges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:5px
}
.miniBadge{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  font-size:11px;
  background:#333;
  color:#ddd
}

/* YouTube Radar */
.youtubeHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px
}
.youtubeTabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.youtubeVideoRow{
  display:flex;
  gap:14px;
  background:#242424;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  align-items:center
}
.youtubeThumb{
  width:180px;
  max-width:32vw;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:8px;
  background:#111
}
.youtubeVideoInfo{
  flex:1;
  min-width:0
}
.youtubeVideoTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px
}
.youtubeVideoActions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px
}
.youtubeCount{
  color:#aaa;
  margin:8px 0 14px
}
.youtubeConnection{
  padding:12px;
  background:#202020;
  border-radius:10px;
  margin-bottom:14px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center
}
.connected{
  color:#5ee28a;
  font-weight:bold
}
.disconnected{
  color:#ff8585;
  font-weight:bold
}

@media(max-width:700px){
  .youtubeVideoRow{align-items:flex-start}
  .youtubeThumb{width:130px}
}
</style>
</head>

<body>

<header>🎵 SUNO Radar V6.9.3</header>

<div class="stats">
  <div class="statBox">
    <div class="statNum" id="statFriends">-</div>
    <div class="statLabel">활성 친구</div>
  </div>
  <div class="statBox">
    <div class="statNum" id="statNew">-</div>
    <div class="statLabel">NEW</div>
  </div>
  <div class="statBox">
    <div class="statNum" id="statRead">-</div>
    <div class="statLabel">READ</div>
  </div>
  <div class="statBox">
    <div class="statNum" id="statArchived">-</div>
    <div class="statLabel">ARCHIVED</div>
  </div>
</div>

<div class="toolbar">

  <button class="btn active" onclick="setState('NEW',this)">NEW</button>
  <button class="btn" onclick="setState('READ',this)">READ</button>
  <button class="btn" onclick="setState('ARCHIVED',this)">ARCHIVED</button>
  <button class="btn" onclick="setState('ALL',this)">전체</button>

  <button class="btn" onclick="setGroup('한국')">한국</button>
  <button class="btn" onclick="setGroup('해외')">해외</button>
  <button class="btn" onclick="clearGroup()">그룹해제</button>

  <button class="btn" onclick="loadTracks()">새로고침</button>
  <button class="scan" onclick="runScan()">수집 실행</button>
  <button class="manage" onclick="toggleFriendPanel()">친구관리</button>

  <button class="youtube" onclick="scanAllYouTube(event)">
    ▶ YouTube 전체확인
  </button>

  <button class="youtubeRadar" onclick="toggleYouTubePanel()">
    📺 YouTube NEW <span id="youtubeNewBadge">0</span>
  </button>

  <button class="manage" onclick="toggleLatestPanel()">최근수집</button>
  <button class="btn" onclick="runCleanup()">정리실행</button>
</div>

<div class="searchBar">
  <input
    id="trackSearch"
    placeholder="곡 제목 / 친구명 검색"
    style="min-width:260px"
    oninput="render()">
</div>

<div id="friendPanel">
  <h2>친구관리</h2>

  <div class="friendForm">
    <input
      id="friendSearch"
      placeholder="친구 검색"
      oninput="loadFriends()"
      style="min-width:180px">

    <input id="newName" placeholder="친구 이름">

    <input
      id="newUrl"
      placeholder="https://suno.com/@아이디"
      style="min-width:260px">

    <select id="newGroup">
      <option value="한국">한국</option>
      <option value="해외">해외</option>
    </select>

    <button class="scan" onclick="addFriend()">친구 추가</button>
    <button class="btn" onclick="loadFriends()">목록 새로고침</button>
  </div>

  <div id="friendCount" class="small">친구목록 로딩중...</div>
  <div id="friendList"></div>
</div>

<div id="latestPanel">
  <h2>최근수집 20곡</h2>
  <div id="latestList"></div>
</div>

<div id="youtubePanel">

  <div class="youtubeHeader">
    <div>
      <h2 style="margin:0 0 5px">📺 YouTube 신영상 레이더</h2>
      <div class="small">
        내가 선택한 YouTube 구독 채널의 새 영상을 SUNO 신곡처럼 확인합니다.
      </div>
    </div>
  </div>

  <div class="youtubeConnection">

    <span id="youtubeAuthStatus">
      YouTube 연결 상태 확인중...
    </span>

    <button
      class="youtube"
      id="youtubeConnectBtn"
      onclick="connectYouTube()">
      Google / YouTube 연결
    </button>

    <button
      class="btn"
      id="youtubeLogoutBtn"
      onclick="disconnectYouTube()"
      style="display:none">
      연결 해제
    </button>
  </div>

  <div class="youtubeTabs">

    <button
      class="youtubeRadar"
      onclick="syncYouTubeSubscriptions(this)">
      구독채널 동기화
    </button>

    <button
      class="manage"
      onclick="toggleYouTubeChannelPanel()">
      구독채널 관리
    </button>

    <button
      class="scan"
      onclick="scanYouTubeVideos(this)">
      YouTube 수집
    </button>

    <button
      class="btn"
      onclick="cleanupYouTubeNow(this)">
      YouTube 정리
    </button>

    <button class="btn active" id="ytTabNEW"
      onclick="setYouTubeState('NEW')">NEW</button>

    <button class="btn" id="ytTabREAD"
      onclick="setYouTubeState('READ')">READ</button>

    <button class="btn" id="ytTabARCHIVED"
      onclick="setYouTubeState('ARCHIVED')">ARCHIVED</button>

    <button class="btn" id="ytTabALL"
      onclick="setYouTubeState('ALL')">전체</button>
  </div>

  <div id="youtubeChannelPanel">

    <div class="youtubeHeader">
      <div>
        <h2 style="margin:0 0 5px">📡 YouTube 구독채널 관리</h2>
        <div class="small">
          감시 ON 채널만 YouTube 수집 대상이 됩니다.
          Google YouTube의 실제 구독 상태는 변경하지 않습니다.
        </div>
      </div>
    </div>

    <div class="youtubeChannelToolbar">

      <input
        id="youtubeChannelSearch"
        placeholder="구독 채널 검색"
        style="min-width:260px"
        oninput="renderYouTubeChannels()">

      <button class="onbtn" onclick="setAllYouTubeChannels(true)">
        전체 ON
      </button>

      <button class="offbtn" onclick="setAllYouTubeChannels(false)">
        전체 OFF
      </button>

      <button class="btn" onclick="loadYouTubeChannels()">
        새로고침
      </button>
    </div>

    <div class="youtubeChannelFilters">
      <button class="filterbtn activeFilter" id="ytChFilterALL"
        onclick="setYouTubeChannelFilter('ALL')">전체</button>
      <button class="filterbtn" id="ytChFilterON"
        onclick="setYouTubeChannelFilter('ON')">🟢 레이더 ON</button>
      <button class="filterbtn" id="ytChFilterOFF"
        onclick="setYouTubeChannelFilter('OFF')">🔕 레이더 OFF</button>
      <button class="filterbtn" id="ytChFilterMUTUAL"
        onclick="setYouTubeChannelFilter('MUTUAL')">🤝 맞팔확인</button>
      <button class="filterbtn" id="ytChFilterFAVORITE"
        onclick="setYouTubeChannelFilter('FAVORITE')">⭐ 관심채널</button>
      <button class="filterbtn" id="ytChFilterUNKNOWN"
        onclick="setYouTubeChannelFilter('UNKNOWN')">❓ 확인불가</button>
    </div>

    <div id="youtubeChannelSummary" class="youtubeChannelSummary">
      구독채널 목록 로딩 전
    </div>

    <div id="youtubeChannelList"></div>

  </div>

  <div class="searchBar"
    style="padding:15px 0 10px;background:transparent">

    <input
      id="youtubeSearch"
      placeholder="YouTube 영상 / 채널 검색"
      style="min-width:260px"
      oninput="renderYouTubeVideos()">
  </div>

  <div id="youtubeCount" class="youtubeCount">
    YouTube 목록 로딩 전
  </div>

  <div id="youtubeVideoList"></div>
</div>

<div id="count">로딩중...</div>
<div id="tracks"></div>

<script>

let allTracks = [];
let currentState = "NEW";
let currentGroup = "ALL";

let youtubeCache = {};
let currentFriendList = [];

let youtubeVideos = [];
let youtubeState = "NEW";
let youtubeChannels = [];
let youtubeChannelFilter = "ALL";

function timeAgo(dateText){

  if(!dateText) return "-";

  const d = new Date(dateText);
  const diff = (Date.now() - d.getTime()) / 1000;

  if(diff < 60) return "방금 전";
  if(diff < 3600) return Math.floor(diff / 60) + "분 전";
  if(diff < 86400) return Math.floor(diff / 3600) + "시간 전";

  return Math.floor(diff / 86400) + "일 전";
}

async function loadStats(){

  try{
    const res = await fetch("/stats");
    const s = await res.json();

    document.getElementById("statFriends").innerText = s.friends ?? 0;
    document.getElementById("statNew").innerText = s.new ?? 0;
    document.getElementById("statRead").innerText = s.read ?? 0;
    document.getElementById("statArchived").innerText = s.archived ?? 0;

  }catch(e){
    console.log("stats fail",e);
  }
}

function setState(state,btn){

  currentState = state;

  document
    .querySelectorAll(".toolbar .btn")
    .forEach(b => b.classList.remove("active"));

  if(btn) btn.classList.add("active");

  loadTracks();
}

function setGroup(group){
  currentGroup = group;
  render();
}

function clearGroup(){
  currentGroup = "ALL";
  render();
}

async function loadTracks(){

  document.getElementById("count").innerText = "로딩중...";

  let url = "/tracks";

  if(currentState !== "ALL")
    url += "?state=" + currentState;

  try{
    const res = await fetch(url);
    allTracks = await res.json();

    await loadStats();
    render();

  }catch(e){
    document.getElementById("count").innerText = "곡 목록 로딩 실패";
  }
}

function badgeClass(state){

  if(state === "NEW") return "new";
  if(state === "READ") return "read";
  if(state === "ARCHIVED") return "archived";

  return "read";
}

async function listenTrack(id,url){

  await fetch("/mark-read/" + id);
  window.open(url,"_blank");
  await loadTracks();
}

function render(){

  let data = allTracks;

  const q =
    document.getElementById("trackSearch")
      .value.trim().toLowerCase();

  if(currentGroup !== "ALL"){
    data = data.filter(t => t.group_name === currentGroup);
  }

  if(q){
    data = data.filter(t =>
      (t.title || "").toLowerCase().includes(q)
      ||
      (t.friend_name || "").toLowerCase().includes(q)
    );
  }

  document.getElementById("count").innerText =
    `상태 ${currentState} / 그룹 ${currentGroup} / 표시 ${data.length}곡`;

  document.getElementById("tracks").innerHTML =
    data.map(t => `
      <div class="card">

        <div class="title">
          <span class="badge ${badgeClass(t.state)}">
            ${t.state || "NEW"}
          </span>
          ${t.title || "Suno song"}
        </div>

        <div class="friend">
          👤
          <a href="${t.profile_url}" target="_blank">
            ${t.friend_name}
          </a>
        </div>

        <div class="meta">
          🌐 ${t.group_name || "-"}
          · 🕒
          ${timeAgo(t.public_at || t.created_at || t.detected_at)}
        </div>

        <button
          class="listen"
          onclick='listenTrack(${t.id},${JSON.stringify(t.track_url)})'>
          듣기
        </button>

      </div>
    `).join("");
}

async function runScan(){

  document.getElementById("count").innerText = "수집 실행중...";

  try{
    const res = await fetch("/scan");
    const result = await res.json();

    alert(
      `수집 완료\n친구: ${result.friends ?? 0}명\n신규 저장: ${result.inserted ?? 0}곡`
    );

    await loadTracks();
    await loadLatest();

  }catch(e){
    alert("SUNO 수집 실패");
  }
}

async function runCleanup(){

  try{
    const res = await fetch("/cleanup");
    const result = await res.json();

    alert("정리 완료: " + JSON.stringify(result));

    await loadTracks();

  }catch(e){
    alert("정리 실패");
  }
}

function toggleFriendPanel(){

  const panel = document.getElementById("friendPanel");

  panel.style.display =
    panel.style.display === "block" ? "none" : "block";

  if(panel.style.display === "block")
    loadFriends();
}

async function loadFriends(){

  const q =
    document.getElementById("friendSearch")
      ?.value?.trim() || "";

  const url =
    q
      ? "/friend-search?q=" + encodeURIComponent(q)
      : "/friends";

  const res = await fetch(url);
  const friends = await res.json();

  currentFriendList = friends;
  window.currentFriendList = friends;

  document.getElementById("friendCount").innerText =
    `친구 ${friends.length}명 / 활성 ${
      friends.filter(f => f.active).length
    }명`;

  document.getElementById("friendList").innerHTML =
    friends.map(f => {

      const yt = youtubeCache[f.id];

      let ytButtonText = "YouTube 확인";
      let ytClass = "btn";
      let ytStatus = "";

      if(yt){

        if(yt.youtube_url){
          ytButtonText = "▶ YouTube 있음";
          ytClass = "youtube youtubeFound";
          ytStatus = "YouTube 링크 발견";
        }else{
          ytButtonText = "YouTube 없음";
          ytClass = "youtubeNone";
          ytStatus = "공개 YouTube 링크 없음";
        }
      }

      return `
      <div class="friendRow ${f.active ? "" : "off"}">

        <div>
          <div class="friendName">
            <a
              href="${f.profile_url}"
              target="_blank"
              style="color:white;text-decoration:none">
              ${f.friend_name} (${f.group_name})
            </a>
          </div>

          <div class="small">${f.profile_url}</div>

          ${
            ytStatus
              ? `<div class="youtubeStatus">${ytStatus}</div>`
              : ""
          }
        </div>

        <div class="friendActions">

          <button
            class="${ytClass}"
            onclick="checkFriendYouTube(${f.id},this)">
            ${ytButtonText}
          </button>

          <button
            class="${f.active ? "onbtn" : "offbtn"}"
            onclick="toggleFriend(${f.id})">
            ${f.active ? "ON" : "OFF"}
          </button>

          <button
            class="danger"
            onclick="deleteFriend(${f.id})">
            삭제
          </button>

        </div>
      </div>
      `;

    }).join("");
}

async function checkFriendYouTube(id,btn){

  if(youtubeCache[id] && youtubeCache[id].youtube_url){

    window.open(youtubeCache[id].youtube_url,"_blank");
    return;
  }

  const originalText = btn.innerText;

  btn.disabled = true;
  btn.innerText = "확인중...";

  try{
    const res = await fetch("/friend-youtube/" + id);
    const result = await res.json();

    youtubeCache[id] = result;

    if(result.youtube_url){

      btn.innerText = "▶ YouTube 있음";
      btn.className = "youtube youtubeFound";
      btn.disabled = false;

      btn.onclick =
        () => window.open(result.youtube_url,"_blank");

    }else{

      btn.innerText = "YouTube 없음";
      btn.className = "youtubeNone";
      btn.disabled = false;
    }

  }catch(e){

    alert("YouTube 확인 실패");
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

async function scanAllYouTube(ev){

  if(!confirm(
    "활성 SUNO 친구 전체의 YouTube 링크를 확인할까요?\n시간이 오래 걸릴 수 있습니다."
  )){
    return;
  }

  const button = ev?.target;
  const originalText = button ? button.innerText : "";

  if(button){
    button.disabled = true;
    button.innerText = "YouTube 확인중...";
  }

  try{

    const res = await fetch("/friends-youtube");
    const result = await res.json();

    if(!result.ok){
      alert("YouTube 전체 확인 실패");
      return;
    }

    if(Array.isArray(result.results)){

      result.results.forEach(r => {

        if(r.id){
          youtubeCache[r.id] = r;
          return;
        }

        const friend =
          currentFriendList.find(
            f => f.friend_name === r.friend
          );

        if(friend)
          youtubeCache[friend.id] = r;
      });
    }

    alert(
      `YouTube 확인 완료\n활성 친구: ${result.friends}명\nYouTube 발견: ${result.found}명`
    );

    await loadFriends();

  }catch(e){

    alert("YouTube 전체 확인 중 오류 발생");

  }finally{

    if(button){
      button.disabled = false;
      button.innerText = originalText;
    }
  }
}

async function addFriend(){

  const name =
    document.getElementById("newName").value.trim();

  const url =
    document.getElementById("newUrl").value.trim();

  const group =
    document.getElementById("newGroup").value;

  if(!name || !url){

    alert("친구 이름과 URL을 입력하세요.");
    return;
  }

  const api =
    `/add-friend?friend_name=${encodeURIComponent(name)}&profile_url=${encodeURIComponent(url)}&group_name=${encodeURIComponent(group)}`;

  const res = await fetch(api);
  const result = await res.json();

  if(!result.ok){

    alert("추가 실패: " + (result.error || "unknown"));
    return;
  }

  document.getElementById("newName").value = "";
  document.getElementById("newUrl").value = "";

  await loadFriends();
  await loadStats();

  alert("친구 추가 완료");
}

async function loadYouTubeAuthStatus(){

  const status =
    document.getElementById("youtubeAuthStatus");

  const connectBtn =
    document.getElementById("youtubeConnectBtn");

  const logoutBtn =
    document.getElementById("youtubeLogoutBtn");

  try{

    const res = await fetch("/youtube/auth/status");
    const data = await res.json();

    if(data.connected){

      status.innerHTML =
        `<span class="connected">● YouTube 연결됨</span>`;

      connectBtn.style.display = "none";
      logoutBtn.style.display = "inline-block";

    }else{

      status.innerHTML =
        `<span class="disconnected">● YouTube 연결 필요</span>`;

      connectBtn.style.display = "inline-block";
      logoutBtn.style.display = "none";
    }

  }catch(e){

    status.innerHTML =
      `<span class="disconnected">● 연결 상태 확인 실패</span>`;
  }
}

function setYouTubeState(state){

  youtubeState = state;

  ["NEW","READ","ARCHIVED","ALL"].forEach(s => {

    const b =
      document.getElementById("ytTab" + s);

    if(b)
      b.classList.toggle("active",s === state);
  });

}

async function loadYouTubeVideos(){

  const count =
    document.getElementById("youtubeCount");

  count.innerText = "YouTube 영상 로딩중...";

  let url = "/youtube/videos";

  if(youtubeState !== "ALL"){
    url += "?state=" + encodeURIComponent(youtubeState);
  }

  try{

    const res = await fetch(url);

    if(!res.ok)
      throw new Error("HTTP " + res.status);

    youtubeVideos = await res.json();

    if(!Array.isArray(youtubeVideos))
      youtubeVideos = [];

    await updateYouTubeBadge();
    renderYouTubeVideos();

  }catch(e){

    youtubeVideos = [];
    count.innerText = "YouTube 영상 로딩 실패";

    document.getElementById("youtubeVideoList").innerHTML = "";
  }
}

async function updateYouTubeBadge(){

  try{

    const res = await fetch("/youtube/stats");
    const data = await res.json();

    document.getElementById("youtubeNewBadge").innerText =
      data.new ?? 0;

  }catch(e){
    console.log("YouTube stats fail");
  }
}

function renderYouTubeVideos(){

  const q =
    document.getElementById("youtubeSearch")
      ?.value?.trim()?.toLowerCase() || "";

  let data = youtubeVideos;

  if(q){

    data = data.filter(v =>
      (v.title || "").toLowerCase().includes(q)
      ||
      (v.channel_title || "").toLowerCase().includes(q)
    );
  }

  document.getElementById("youtubeCount").innerText =
    `YouTube 상태 ${youtubeState} / 표시 ${data.length}개`;

  document.getElementById("youtubeVideoList").innerHTML =
    data.map(v => {

      const thumb = v.thumbnail_url || "";

      const url =
        v.video_url ||
        (
          v.video_id
            ? "https://www.youtube.com/watch?v=" + v.video_id
            : "#"
        );

      return `
      <div class="youtubeVideoRow">

        ${
          thumb
            ? `<img class="youtubeThumb" src="${thumb}" alt="">`
            : `<div class="youtubeThumb"></div>`
        }

        <div class="youtubeVideoInfo">

          <div class="youtubeVideoTitle">

            <span class="badge ${badgeClass(v.state)}">
              ${v.state || "NEW"}
            </span>

            ${v.title || "YouTube video"}
          </div>

          <div class="small">
            📺 ${v.channel_title || "-"}
            · 🕒
            ${timeAgo(v.published_at || v.detected_at)}
          </div>

          <div class="youtubeVideoActions">

            <button
              class="youtube"
              onclick='openYouTubeVideo(${v.id},${JSON.stringify(url)})'>
              ▶ 영상보기
            </button>

          </div>

        </div>
      </div>
      `;

    }).join("");
}

/* =====================================================
   YouTube 구독채널 관리 V6.9.3
   ===================================================== */

function toggleYouTubeChannelPanel(){

  const panel =
    document.getElementById("youtubeChannelPanel");

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";

  if(panel.style.display === "block"){

    loadYouTubeChannels();

    setTimeout(() => {

      panel.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    },50);
  }
}

async function loadYouTubeChannels(){

  const summary =
    document.getElementById("youtubeChannelSummary");

  summary.innerText = "구독채널 로딩중...";

  try{

    const res = await fetch("/youtube/channels");

    if(!res.ok)
      throw new Error("HTTP " + res.status);

    youtubeChannels = await res.json();

    if(!Array.isArray(youtubeChannels))
      youtubeChannels = [];

    renderYouTubeChannels();

  }catch(e){

    youtubeChannels = [];

    summary.innerText =
      "구독채널 목록 로딩 실패";

    document.getElementById("youtubeChannelList").innerHTML = "";
  }
}

function setYouTubeChannelFilter(filter){

  youtubeChannelFilter = filter;

  ["ALL","ON","OFF","MUTUAL","FAVORITE","UNKNOWN"].forEach(f => {
    const b = document.getElementById("ytChFilter" + f);
    if(b) b.classList.toggle("activeFilter", f === filter);
  });

  renderYouTubeChannels();
}

function renderYouTubeChannels(){

  const q =
    document.getElementById("youtubeChannelSearch")
      ?.value?.trim()?.toLowerCase() || "";

  let data = [...youtubeChannels];

  if(q){
    data = data.filter(c =>
      (c.channel_title || "")
        .toLowerCase()
        .includes(q)
    );
  }

  if(youtubeChannelFilter === "ON"){
    data = data.filter(c => c.active);
  }else if(youtubeChannelFilter === "OFF"){
    data = data.filter(c => !c.active);
  }else if(youtubeChannelFilter === "MUTUAL"){
    data = data.filter(c => c.relation_status === "MUTUAL");
  }else if(youtubeChannelFilter === "FAVORITE"){
    data = data.filter(c => c.favorite === true);
  }else if(youtubeChannelFilter === "UNKNOWN"){
    data = data.filter(c => (c.relation_status || "UNKNOWN") === "UNKNOWN");
  }

  const activeCount =
    youtubeChannels.filter(c => c.active).length;

  const mutualCount =
    youtubeChannels.filter(c => c.relation_status === "MUTUAL").length;

  const favoriteCount =
    youtubeChannels.filter(c => c.favorite === true).length;

  document.getElementById("youtubeChannelSummary").innerText =
    `레이더 ON ${activeCount}개 / 전체 구독 ${youtubeChannels.length}개 / 맞팔확인 ${mutualCount}개 / 관심 ${favoriteCount}개 / 표시 ${data.length}개`;

  document.getElementById("youtubeChannelList").innerHTML =
    data.map(c => {

      const mutual = c.relation_status === "MUTUAL";
      const favorite = c.favorite === true;

      return `
      <div class="youtubeChannelRow ${c.active ? "" : "off"}">

        ${
          c.thumbnail_url
            ? `<img class="youtubeChannelThumb" src="${c.thumbnail_url}" alt="">`
            : `<div class="youtubeChannelThumb"></div>`
        }

        <div class="youtubeChannelInfo">

          <div class="youtubeChannelTitle">
            <a
              href="${c.channel_url || "#"}"
              target="_blank"
              style="color:white;text-decoration:none">
              ${favorite ? "⭐ " : ""}${c.channel_title || "YouTube channel"}
            </a>
          </div>

          <div class="channelBadges">
            <span class="miniBadge">${c.active ? "🟢 레이더 ON" : "🔕 레이더 OFF"}</span>
            <span class="miniBadge">${mutual ? "🤝 맞팔확인" : "❓ 확인불가"}</span>
            ${favorite ? `<span class="miniBadge">⭐ 관심채널</span>` : ""}
          </div>

        </div>

        <div class="friendActions">

          <button
            class="${favorite ? "favoriteOn" : "favoriteOff"}"
            onclick="toggleYouTubeFavorite(${c.id})">
            ${favorite ? "⭐ 관심" : "☆ 관심"}
          </button>

          <button
            class="${mutual ? "relationMutual" : "relationUnknown"}"
            onclick="toggleYouTubeRelation(${c.id},${JSON.stringify(c.relation_status || "UNKNOWN")})">
            ${mutual ? "🤝 맞팔" : "❓ 확인불가"}
          </button>

          <button
            class="${c.active ? "onbtn" : "offbtn"}"
            onclick="toggleYouTubeChannel(${c.id})">
            ${c.active ? "레이더 ON" : "레이더 OFF"}
          </button>

        </div>

      </div>
      `;
    }).join("");
}

async function toggleYouTubeRelation(id,current){

  const next =
    current === "MUTUAL"
      ? "UNKNOWN"
      : "MUTUAL";

  try{

    const res =
      await fetch(
        "/youtube/channels/" + id + "/relation",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            relation_status:next
          })
        }
      );

    const result = await res.json();

    if(!res.ok || !result.ok)
      throw new Error(result.error || "관계상태 변경 실패");

    await loadYouTubeChannels();

  }catch(e){

    alert(
      "맞팔 상태 변경 실패\\n\\n" +
      e.message
    );
  }
}

async function toggleYouTubeFavorite(id){

  try{

    const res =
      await fetch(
        "/youtube/channels/" + id + "/favorite",
        {
          method:"POST"
        }
      );

    const result = await res.json();

    if(!res.ok || !result.ok)
      throw new Error(result.error || "관심채널 변경 실패");

    await loadYouTubeChannels();

  }catch(e){

    alert(
      "관심채널 변경 실패\\n\\n" +
      e.message
    );
  }
}

async function toggleYouTubeChannel(id){

  try{

    const res =
      await fetch(
        "/youtube/channels/" + id + "/toggle",
        {method:"POST"}
      );

    const result = await res.json();

    if(!res.ok || !result.ok)
      throw new Error(result.error || "변경 실패");

    await loadYouTubeChannels();

  }catch(e){

    alert(
      "구독채널 감시 설정 변경 실패\n\n" +
      e.message
    );
  }
}

async function setAllYouTubeChannels(active){

  const text =
    active
      ? "모든 구독채널을 감시 ON으로 바꿀까요?"
      : "모든 구독채널을 감시 OFF로 바꿀까요?";

  if(!confirm(text))
    return;

  try{

    const res =
      await fetch(
        "/youtube/channels/set-all",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({active})
        }
      );

    const result = await res.json();

    if(!res.ok || !result.ok)
      throw new Error(result.error || "변경 실패");

    await loadYouTubeChannels();

  }catch(e){

    alert(
      "전체 감시 설정 변경 실패\n\n" +
      e.message
    );
  }
}
